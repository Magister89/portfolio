<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    // Single Page Apps for GitHub Pages
    // https://github.com/rafgraph/spa-github-pages
    // Store the current path and redirect to index.html
    // The index.html will restore the path using history.replaceState
    (function() {
      var pathSegmentsToKeep = 0; // For custom domain, keep 0. For username.github.io/repo, use 1
      var l = window.location;
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectSearch = l.search;

      sessionStorage.setItem('spa-redirect', JSON.stringify({
        path: '/' + redirectPath + redirectSearch + l.hash
      }));

      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/');
    })();
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
